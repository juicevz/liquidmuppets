server {
    listen 80;
    listen [::]:80;
    server_name liquidmuppets.io www.liquidmuppets.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://liquidmuppets.io$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.liquidmuppets.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://liquidmuppets.io/docs;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.liquidmuppets.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/liquidmuppets.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liquidmuppets.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LiquidMuppetsSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://liquidmuppets.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.liquidmuppets.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/liquidmuppets.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liquidmuppets.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LiquidMuppetsSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://liquidmuppets.io/docs;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liquidmuppets.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/liquidmuppets.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liquidmuppets.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LiquidMuppetsSSL:10m;
    ssl_session_tickets off;

    root /var/www/liquidmuppets/current;
    index index.html;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    location ^~ /downloads/ {
        alias /var/www/liquidmuppets-downloads/;
        expires 1h;
        access_log off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name liquidmuppets.io www.liquidmuppets.io docs.liquidmuppets.io;
    server_tokens off;

    root /var/www/liquidmuppets/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
